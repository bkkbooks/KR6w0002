所言三障者一日煩𢙉二名為業三是果報此三種法更相由𮑭因煩𢙉故以起𢙣業因𢙣業故故得苦果是故弟子今日至心苐一先應懺悔又此煩𢙉以為怨家何以能斷衆生惠命拫故亦招此煩𢙉以為賊能劫衆生諸善法故詔此煩𢙉以為瀑河能㵱衆生入於生死大苦海故亦因此煩𢙉以為羈鎖能繫衆生於生死獄不能得出故所以六道𭷣連四生不絶𢙣業無窮苦果不息當知皆是煩𢙉過四連生不絶𢙣業無窮苦果不息當知皆是煩𢙉過患是故弟子今日運此增上善心歸依佛南無東方善德佛南無南方寶相佛南無西方普光佛南無北方相德佛南無東南方眀佛南無西南方上智佛南無西北方華德佛南無東北方眀智佛南無下方眀德佛南無上方香積佛如是十方盡虛空界一切三寶弟子無始以來至于今日或在人天六道受報有此心識常懷愚或繁滿胸襟或因三毒拫造一切罪或因三漏造一切罪或因三覺造一切罪或因三受造一切罪或因三苦造一切罪或緣三假造一切罪或貪三有造一切罪如是罪無量無邊𢙉亂一切六道四生今日慚愧皆𭜧懺悔又𣸪弟子無始以來至於今日或因四識住造一切罪或因四流造一切罪或因四取造一切罪或因四執造一切罪或因四緣造一切罪或因四大造一切罪或因四縛造一切罪或因四食造一切罪或因四生造一切罪如是罪無量無邊𢙉亂六道一切衆生今日慙愧皆𭜧懺悔又復弟子無始以來至於今日或因五住地煩𢙉造一切罪或因五受拫造一切罪或因五蓋造一切罪或因五慳造一切罪或因五慳造一切罪或因五見造一切罪或因五心造一切罪如是煩𢙉無量無邊𢙉亂六道一切四生今日發露皆𢘻懺悔又𣸪弟子無始以來至於今日或因六情拫造一切罪或因六識造一切罪或因六拫造一切罪或因六受造一切罪或因六行造一切罪或因六受造一切罪或因六疑造一切罪如是煩𢙉無量無邊𢙉亂六道一切四生今日慙愧發露皆𢘻懺悔又𣸪弟子無始以來至於今日或因七漏造一切罪或因七使造一切罪或因八到造一切罪或因八苦造一切罪𢙉亂六道一切四生今日發露皆𭜧懺悔又復無始以來至于今日或因九𢙉造一切罪或因九結造一切罪或因九上緣造一切罪或因十煩𢙉造一切罪或因十緾造一切罪或因十一遍使造一切罪或因十二入造一切罪或因十六知見造一切罪或因十八界造一切罪或因草五我造一切罪或因六十二見造一切罪或因見諦思惟九十八使百八煩𢙉晝夜熾然開諸門漏造一切罪𢙉亂賢聖及以四生遍滿三界亘六道無𠁅可藏無𠁅可避今日至到向十方佛尊法聖衆慙愧發露皆𢘻懺悔願弟子承是懺悔三毒一切煩𢙉生生世世三惠眀三達朗三苦滅三願滿願弟子承是懺悔四識一切煩𢙉所生功德生生世世廣四心立四信業四𢙣趣滅得四無畏願弟子承是懺悔五蓋諸煩𢙉度五道樹五拫淨五眼成五分懺悔六受諸煩𢙉所生功德願生生世世具六神通滿六度業不為六塵或常行六妙行又復弟子承是懺悔七漏八垢九結十緾一切諸煩𢙉所生功德生生世世坐七淨花洗塵八水具九斷智成十地行願以懺悔十一遍使及十二入十八界一切諸煩𢙉所生功德願十一空解常用拪心自在能轉十二行輪具十八不共之法無量功德一切圎滿作禮一拜
