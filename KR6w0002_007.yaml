body:
  text: 南無可喜佛南無善香佛南無疾佛南無妙眼佛南無善勝佛南無修義佛南無善意佛南無妙意佛南無金意佛南無善眼佛南無天清淨佛南無輸頭檀佛南無善見佛南無毗留羅佛南無毗摟義佛南無梵聲佛南無成就勝佛南無勝光明佛南無無垢佛南無摩陀佛南無摩梨栺佛南無大摩梨指佛南無能聖佛南無聲自在佛南無讚歎成就佛南無勝成就華佛南無拘蘇摩佛南無不動佛南無日藏佛南無樂聲佛南無能作光佛南無龍德佛此以上五千五百佛十二部經一切賢聖南無金剛光佛南無稱王佛南無𮓜王佛南無高光佛南無發行佛南無智成就佛南無香自在佛南無𮟯羅延藏佛南無火藏佛南無破垢勝王佛南無寶蓋脫光佛南無山自在王佛南無寶月佛南無師子奮迅幢自在王佛南無寶根廣眼佛南無世自在王佛南無遠離諸怖畏隨煩𢙉聲佛南無敷華盧舍𮟯佛南無香波頭摩佛南無無垢功德威德王佛南無不動佛南無日藏佛南無樂自在聲大佛南無智日佛南無月藏佛南無金剛齒佛南無龍吼佛南無勝自在佛南無不可思議王佛南無火勝藏佛南無喜幢佛南無無畏自在佛南無見留佛南無智像佛南無無垢眼佛南無無憂勝佛南無法自在吼佛南無去自在莎羅王佛南無師子奮迅佛南無𮟯羅延佛南無善擇藏佛南無寶集佛南無功德奮迅佛南無火藏佛南無星𪧐稱佛南無功德力堅固王佛南無妙吼聲奮迅佛南無莎羅勝點王佛南無威德自在光眀佛南無妙聲吼佛南無寶掌龍自在王佛南無法雲吼自在平佛南無寶山佛南無妙光藏佛南無師子修多羅佛南無普藏佛南無淨華佛南無歌羅毗羅奮迅佛南無法疾然燈佛南無無上留佛南無稱聲王佛南無梵諦釋聲佛南無遠離逼惚佛南無毗沙門堅固王佛南無破摩王宮佛南無莎羅王佛南無大奮迅光佛南無華勝佛南無旃檀佛南無留王佛南無拘羅伽堅固樹提佛南無智奮迅佛南無二万同名月然燈佛南無無垢身佛南無波頭摩光佛南無華勝𡵯佛南無華光佛南無稱幢佛南無𨵻浮檀金光佛南無多摩羅葉栴檀香佛南無大道智勝佛南無不動佛南無留山佛南無師子吼佛南無師子幢佛南無住虛空佛南無常入涅槃佛南無帝釋幢佛南無梵幢佛南無無量壽佛南無善度佛南無雲燈佛南無留劫佛南無多羅摩葉旃檀香佛南無雲自在王佛南無一切世間高佛南無能破諸畏佛南無𥼶迦牟佛南無法光眀佛南無五百普光眀佛此以上五千六百佛十二部經一切賢聖南無大海住持智奮迅通佛南無七寶波頭摩𡵯佛南無二千寶幢佛南無多寶佛南無一切衆生愛見佛南無百千光眀滿幢佛南無二千億千驚怖吼聲王佛南無二十億百日月然燈佛南無二十億百妙聲王佛南無二十億百雲聲王佛南無寶威德高王佛南無月光無垢日光眀勝佛南無蓮花葉星𪧐王花通佛南無雲妙鼓聲王佛南無住持水吼聲妙聲星𪧐王拘蘇摩通佛南無莎羅樹王佛南無無垢光眀佛南無寶炎佛南無華林王華通佛南無日月寶作光眀佛南無功德寶光眀佛南無寶杖佛南無雲王佛南無寶蓋勝光眀佛南無普見佛南無功德自在佛南無師子聲作佛南無寶積示現佛南無樂堅佛南無菩提意佛南無量命佛南無阿閦佛南無香王佛南無寶作佛南無修行法王佛南無蓋王佛南無摩王佛南無月藏佛南無日藏佛南無聲身王佛南無善覺佛南無須劫佛南無能聖佛南無寶波頭摩月淨勝王佛南無不動佛南無普滿佛南無盡慧佛南無寶幢佛南無奮迅恭敬稱佛南無無垢光眀藏佛南無雲護佛南無師子奮迅佛南無勝高山王佛南無波頭摩上佛南無身上佛南無多寶妙佛南無勝藏山增上王佛南無意勇猛仙行勝佛南無甘露藏佛南無妙鼓聲王佛南無日月佛南無唯寶蓋佛南無普光眀奮迅光眀佛南無能行成就聖佛南無不動佛南無無垢光眀稱王佛南無九十法㽵嚴佛南無摩金蓋佛南無星𪧐佛南無高山歡喜佛南無菩提分華身佛南無如寶佛南無寶作佛南無能修行佛南無高聚佛南無寶光眀佛南無寶來佛南無寶高佛南無阿閦佛南無寶光眀佛南無大光眀佛南無不可量聲佛南無不可思議聲佛南無大稱佛南無寶照佛南無得大無畏佛南無寶聲佛南無無邊清淨佛南無月聲佛南無無邊稱佛南無月光清淨佛南無清淨光佛南無無垢光佛南無無邊寶佛南無波頭摩勝佛南無身勝佛南無金色佛南無梵聲王佛南無金光眀佛此以上五千七百佛十二部經一切賢聖南無金色作佛南無龍自在王佛南無金色華香自在王佛南無堅固王佛南無堅固勇仙行勝佛南無勝藏摩光佛南無無量香光佛南無師子吼聲佛南無大勢至精進修行畢竟佛南無堅固智佛南無妙鼓聲王佛南無月妙佛南無華勝佛南無世間燈佛南無火佛南無寶輪佛南無無垢智佛南無常寂滅佛南無無邊寶化光眀佛南無須山奮迅佛南無寶華佛南無集寶聚佛南無不退輪寶住勝佛南無德普盧舍𮟯清淨佛南無日月燈佛南無迷留佛南無大留佛南無須劫佛南無香面佛南無成就香佛南無留香佛南無清淨光佛南無法上佛南無香自在王佛南無大摩佛南無香光佛南無火光佛南無甘露光佛南無月光佛南無月燈佛南無月照佛南無月聲佛南無勝作佛南無多寶佛南無師子吼佛南無師子聲佛南無勇猛仙佛南無金剛喜佛南無護一切佛南無離諸疑佛南無寶炎眷屬佛南無無憂佛南無住持速力佛南無妙喜佛南無自在作佛南無無邊聲佛南無然燈作佛南無寶光眀佛南無阿陀佛南無釋佛南無擇聲佛南無勝藏積吼王佛南無降伏金剛堅佛南無寶月光佛南無寶火佛南無賢上佛南無寶波頭摩𡵯佛南無寶勝佛南無金寶光佛南無怖喜快勝佛南無不可量勝佛南無